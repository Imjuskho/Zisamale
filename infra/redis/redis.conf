# Redis configuration for Zisamale

# Network
bind 0.0.0.0
port 6379

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb
dir /data

# Logging
loglevel notice

# Security (enable in production)
# requirepass your_password_here
