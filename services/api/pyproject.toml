[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zisamale-api"
version = "0.1.0"
description = "Zisamale Cloud API - AI-augmented community health intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "redis[hiredis]>=5.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "app.deps.require_role", "app.deps.scoped_db"]

[tool.ruff.lint.per-file-ignores]
# Triple-quoted HTML/SQL/template bodies — content bytes must stay stable.
"app/routers/demo_seeder.py" = ["E501"]
"app/routers/knowledge.py" = ["E501"]
"app/routers/map_layers.py" = ["E501"]
"app/routers/visits.py" = ["E501"]
"app/routers/registry.py" = ["E501"]
"app/schemas/knowledge.py" = ["E501"]
"app/integrations/cht_mapping.py" = ["E501"]
"app/demo_seeder.py" = ["E501"]
"tests/test_cht_mapping.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole session: the asyncpg pool binds connections to the
# first event loop that touches them, so per-function loops break every
# module after the first DB test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
