name: Zisamale Deploy

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  release:
    types: [published]

env:
  DOCKERHUB_NAMESPACE: zisamale

jobs:
  build:
    name: Build & push ${{ matrix.name }}
    # Build images on pushes to main and on release tags
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: services/api
            dockerfile: services/api/Dockerfile.prod
            image: zisamale-api
          - name: ml
            context: services/ml
            dockerfile: services/ml/Dockerfile.prod
            image: zisamale-ml
          - name: dashboard
            context: services/dashboards
            dockerfile: services/dashboards/Dockerfile.prod
            image: zisamale-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute version tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-staging:
    name: Deploy to staging
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm upgrade (staging)
        run: |
          helm upgrade --install zisamale deploy/helm/zisamale \
            --namespace zisamale --create-namespace \
            -f deploy/helm/zisamale/values.yaml \
            -f deploy/helm/zisamale/values-staging.yaml \
            --set global.imageRegistry=${{ env.DOCKERHUB_NAMESPACE }} \
            --set api.image.tag=${{ github.sha }} \
            --set ml.image.tag=${{ github.sha }} \
            --set dashboard.image.tag=${{ github.sha }} \
            --atomic --timeout 10m

  deploy-production:
    name: Deploy to production
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm upgrade (production)
        run: |
          helm upgrade --install zisamale deploy/helm/zisamale \
            --namespace zisamale --create-namespace \
            -f deploy/helm/zisamale/values.yaml \
            -f deploy/helm/zisamale/values-production.yaml \
            --set global.imageRegistry=${{ env.DOCKERHUB_NAMESPACE }} \
            --set api.image.tag=${{ steps.ver.outputs.version }} \
            --set ml.image.tag=${{ steps.ver.outputs.version }} \
            --set dashboard.image.tag=${{ steps.ver.outputs.version }} \
            --atomic --timeout 15m

      - name: Verify rollout
        run: |
          kubectl -n zisamale rollout status deployment/zisamale-api --timeout=5m
          kubectl -n zisamale rollout status deployment/zisamale-dashboard --timeout=5m
