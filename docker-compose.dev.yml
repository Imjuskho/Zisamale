services:
  postgres:
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: zisamale_test
      POSTGRES_USER: zisamale_test
      POSTGRES_PASSWORD: test_password

  api:
    environment:
      DATABASE_URL: postgresql+asyncpg://zisamale_test:test_password@postgres:5432/zisamale_test
      ENVIRONMENT: testing
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    profiles:
      - test
