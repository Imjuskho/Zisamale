apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: zisamale
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: zisamale
spec:
  # Daily at 02:00 UTC
  schedule: "0 2 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgis/postgis:16-3.4
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef:
                      name: zisamale-config
                      key: DB_HOST
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: zisamale-config
                      key: DB_PORT
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: zisamale-config
                      key: DB_NAME
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: zisamale-config
                      key: DB_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: zisamale-secrets
                      key: DB_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  STAMP="$(date +%Y%m%d-%H%M%S)"
                  OUT="/backups/${PGDATABASE}-${STAMP}.sql.gz"
                  echo "Dumping ${PGDATABASE} to ${OUT}"
                  pg_dump --no-owner --no-privileges | gzip > "${OUT}"
                  echo "Backup complete: $(du -h "${OUT}" | cut -f1)"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: zisamale
  labels:
    app.kubernetes.io/name: postgres-backup
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
