apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zisamale
  namespace: zisamale
  labels:
    app.kubernetes.io/part-of: zisamale
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # API serves websockets (realtime alerts)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.zisamale.mw
        - dashboard.zisamale.mw
      secretName: zisamale-tls
  rules:
    - host: api.zisamale.mw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
    - host: dashboard.zisamale.mw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
