apiVersion: apps/v1
kind: Deployment
metadata:
  name: zisamale-dashboard
  namespace: zisamale
  labels:
    app.kubernetes.io/name: zisamale-dashboard
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: zisamale
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: zisamale-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zisamale-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
      containers:
        - name: dashboard
          image: zisamale/zisamale-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: zisamale
  labels:
    app.kubernetes.io/name: zisamale-dashboard
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zisamale-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
