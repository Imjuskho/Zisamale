# Staging environment overrides.
# Usage: helm upgrade --install zisamale deploy/helm/zisamale -f deploy/helm/zisamale/values-staging.yaml

global:
  environment: staging
  imagePullPolicy: IfNotPresent

api:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

ml:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

dashboard:
  replicaCount: 2

public:
  replicaCount: 2

postgres:
  storageSize: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

redis:
  maxmemory: 512mb

ingress:
  enabled: true
  className: nginx
  clusterIssuer: letsencrypt-staging
  apiHost: api.staging.zisamale.mw
  dashboardHost: dashboard.staging.zisamale.mw
  tls:
    enabled: true

monitoring:
  serviceMonitor:
    enabled: true
